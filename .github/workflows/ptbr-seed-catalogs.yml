name: PT-BR Seed Catalogs

on:
  push:
    branches: ["ptbr/translation-engine"]

permissions:
  contents: write

concurrency:
  group: ptbr-seed-catalogs
  cancel-in-progress: true

jobs:
  seed:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ptbr/translation-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PT-BR tooling
        run: python -m pip install -e "tools/forge_ptbr[dev]"
      - name: Generate real Adventure catalogs
        run: forge-ptbr catalog-sync --repo . --catalogs-dir translations/catalogs
      - name: Commit generated catalogs when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- translations/catalogs)" ]; then
            echo "Catalogs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/catalogs
          git commit -m "data(ptbr): seed Adventure translation catalogs"
          git push origin HEAD:ptbr/translation-engine
