name: PT-BR Tools

on:
  push:
    branches: [ptbr-adventure]
    paths:
      - "tools/forge_ptbr/**"
      - "translations/**"
      - ".github/workflows/ptbr-tools.yml"
  pull_request:
    paths:
      - "tools/forge_ptbr/**"
      - "translations/**"
      - ".github/workflows/ptbr-tools.yml"

concurrency:
  group: ptbr-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PT-BR tooling
        run: python -m pip install -e "tools/forge_ptbr[dev]"
      - name: Run tests
        run: python -m pytest tools/forge_ptbr/tests -q
      - name: Smoke scan repository
        run: forge-ptbr scan --repo . --output tools/forge_ptbr/build/inventory.json
      - name: Smoke sync translation catalogs
        run: forge-ptbr catalog-sync --repo . --catalogs-dir tools/forge_ptbr/build/catalogs-ci
      - name: Verify Adventure resources remain untouched
        run: git diff --exit-code -- forge-gui/res/adventure
      - name: Upload generated catalog fixture
        uses: actions/upload-artifact@v4
        with:
          name: ptbr-catalogs-${{ runner.os }}
          path: tools/forge_ptbr/build/catalogs-ci/
          if-no-files-found: error
